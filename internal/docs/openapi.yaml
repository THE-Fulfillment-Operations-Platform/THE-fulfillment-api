openapi: 3.0.3
info:
  title: THE Fulfillment Operations API
  version: 0.1.0-mvp
  description: >
    Backend MVP cho THE Fulfillment Operations Platform — quản lý đơn hàng và vận
    hành xưởng fulfillment: import đơn, design queue, batch theo nguyên vật liệu,
    production status (Pending/Đã in/Đã cắt/Đã QC), QC đối chiếu mockup, packing
    và handoff THE. Mọi response dùng envelope { success, data, meta?, error? }.
servers:
  - url: http://localhost:8080
    description: Local
tags:
  - name: Auth
  - name: Users
  - name: Sellers
  - name: Stores
  - name: Catalog
  - name: Import
  - name: Orders
  - name: Items
  - name: Design
  - name: Batches
  - name: QC
  - name: Packing
  - name: Handoffs
  - name: Notes
  - name: Seller View
  - name: Audit
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Envelope:
      type: object
      properties:
        success: { type: boolean }
        data: {}
        meta:
          type: object
          properties:
            page: { type: integer }
            page_size: { type: integer }
            total: { type: integer }
            total_pages: { type: integer }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, example: ops@the.local }
        password: { type: string, example: "Password123!" }
    ImportRow:
      type: object
      description: >
        Một dòng của file import (1 dòng = 1 sản phẩm; các dòng cùng ORDER ID gộp
        thành 1 đơn). Khoá là NHÃN CỘT trong file. Backend nhận cả nhãn template
        2026-08 (tiếng Việt) lẫn nhãn template cũ (StoreOrderID, ShippingName…).
        Các cột đã ngừng nhập — ShippingMethod, ProductName, VariantCode, IOSS,
        ShippingEmail — vẫn parse được nhưng bị bỏ qua và báo lại trong
        preview.headers.retired.
      properties:
        "Seller ID": { type: string, description: "Đối chiếu với seller đang import; khác seller → chặn dòng" }
        Account: { type: string }
        "Shop name": { type: string }
        DATE: { type: string, description: "Ngày đặt → order_date + STT trong ngày. 20/08/2026 hoặc 2026-08-20" }
        name: { type: string, description: "Tên người nhận" }
        "Địa chỉ nhận": { type: string }
        "Địa chỉ nhận (Phụ)": { type: string }
        "Thành phố": { type: string }
        "Mã vùng": { type: string, description: "Bang/tỉnh (KHÔNG phải mã vùng điện thoại)" }
        Zipcode: { type: string }
        "Quốc Gia": { type: string }
        "ORDER ID": { type: string }
        "MÃ SKU": { type: string }
        "Mã ảnh (nếu có)": { type: string }
        "SỐ LƯỢNG": { type: integer }
        "DESIGN ORDER": { type: string, description: "Link design mặt trước" }
        designBack: { type: string, description: "Link design mặt sau (sản phẩm 2 mặt)" }
        Mockup: { type: string, description: "Mockup URL seller gửi — chuẩn QC" }
        "EngraveText (if have)": { type: string }
        ShippingPhone: { type: string }
        Phone: { type: string, description: "Dự phòng: chỉ dùng khi ShippingPhone trống" }
        Note: { type: string }
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Auth]
      summary: Health check
      security: []
      responses: { '200': { description: OK } }
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập, trả JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Token + user }
        '401': { description: Sai thông tin đăng nhập }
  /api/me:
    get:
      tags: [Auth]
      summary: Thông tin user hiện tại
      responses: { '200': { description: User } }
  /api/users:
    get: { tags: [Users], summary: Danh sách user, responses: { '200': { description: OK } } }
    post:
      tags: [Users]
      summary: Tạo user (ADMIN/OWNER)
      responses: { '201': { description: Created } }
  /api/users/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Users], summary: Chi tiết user, responses: { '200': { description: OK } } }
    put: { tags: [Users], summary: Cập nhật user, responses: { '200': { description: OK } } }
    delete: { tags: [Users], summary: Xóa user, responses: { '200': { description: OK } } }
  /api/sellers:
    get: { tags: [Sellers], summary: Danh sách seller, responses: { '200': { description: OK } } }
    post: { tags: [Sellers], summary: Tạo seller, responses: { '201': { description: Created } } }
  /api/sellers/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Sellers], summary: Chi tiết seller, responses: { '200': { description: OK } } }
    put: { tags: [Sellers], summary: Cập nhật seller, responses: { '200': { description: OK } } }
    delete: { tags: [Sellers], summary: Xóa seller, responses: { '200': { description: OK } } }
  /api/stores:
    get: { tags: [Stores], summary: Danh sách store, responses: { '200': { description: OK } } }
    post: { tags: [Stores], summary: Tạo store, responses: { '201': { description: Created } } }
  /api/stores/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Stores], summary: Chi tiết store, responses: { '200': { description: OK } } }
    put: { tags: [Stores], summary: Cập nhật store, responses: { '200': { description: OK } } }
    delete: { tags: [Stores], summary: Xóa store, responses: { '200': { description: OK } } }
  /api/materials:
    get: { tags: [Catalog], summary: Danh sách nguyên vật liệu, responses: { '200': { description: OK } } }
    post: { tags: [Catalog], summary: Tạo material, responses: { '201': { description: Created } } }
  /api/materials/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Catalog], summary: Chi tiết material, responses: { '200': { description: OK } } }
    put: { tags: [Catalog], summary: Cập nhật material, responses: { '200': { description: OK } } }
    delete: { tags: [Catalog], summary: Xóa material, responses: { '200': { description: OK } } }
  /api/skus:
    get: { tags: [Catalog], summary: Danh sách SKU, responses: { '200': { description: OK } } }
    post:
      tags: [Catalog]
      summary: Tạo SKU (single hoặc combo nhiều material)
      responses: { '201': { description: Created } }
  /api/skus/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Catalog], summary: Chi tiết SKU, responses: { '200': { description: OK } } }
    put: { tags: [Catalog], summary: Cập nhật SKU + material set, responses: { '200': { description: OK } } }
    delete: { tags: [Catalog], summary: Xóa SKU, responses: { '200': { description: OK } } }
  /api/orders/import:
    post:
      tags: [Import]
      summary: Import đơn (JSON rows hoặc multipart CSV). commit=false để preview.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [seller_id, rows]
              properties:
                seller_id: { type: integer }
                commit: { type: boolean }
                filename: { type: string }
                rows: { type: array, items: { $ref: '#/components/schemas/ImportRow' } }
          multipart/form-data:
            schema:
              type: object
              properties:
                seller_id: { type: integer }
                commit: { type: boolean }
                file: { type: string, format: binary }
      responses:
        '200': { description: Preview hoặc preview+commit result }
  /api/orders/import/commit:
    post:
      tags: [Import]
      summary: Commit một import job đã preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [import_job_id]
              properties: { import_job_id: { type: integer } }
      responses: { '200': { description: Committed import job } }
  /api/import-jobs:
    get: { tags: [Import], summary: Danh sách import job, responses: { '200': { description: OK } } }
  /api/import-jobs/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Import], summary: Chi tiết import job + lỗi theo dòng, responses: { '200': { description: OK } } }
  /api/orders:
    get:
      tags: [Orders]
      summary: Danh sách đơn (filter store, sku, status, date) + tra cứu CS
      description: >
        Mở cho cả role CS. `search` là ô tìm kiếm một dòng của màn CS: khớp
        store_order_id, internal_code, tracking_number, tên/điện thoại/email
        người nhận. Các tham số hẹp bên dưới dùng khi đã biết đang cầm mã gì.
      parameters:
        - { name: seller_id, in: query, schema: { type: integer } }
        - { name: store_id, in: query, schema: { type: integer } }
        - { name: sku, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [PRODUCTION, PACKED, HANDED_OFF, SHIPPED] } }
        - { name: store_order_id, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string }, description: Tra cứu CS một ô }
        - { name: internal_code, in: query, schema: { type: string } }
        - { name: tracking_number, in: query, schema: { type: string } }
        - { name: shipping_name, in: query, schema: { type: string }, description: Tên người nhận }
        - { name: shipping_phone, in: query, schema: { type: string } }
        - { name: tracking_status, in: query, schema: { type: string } }
        - { name: has_tracking, in: query, schema: { type: boolean }, description: "false = hàng đợi CS chưa có mã vận đơn" }
        - { name: handed_over, in: query, schema: { type: boolean }, description: "true = đơn đã gửi cho THE (màn Hành trình)" }
        - { name: handed_over_from, in: query, schema: { type: string }, description: "Lọc theo thời điểm xuất xưởng (RFC3339 hoặc YYYY-MM-DD), >=" }
        - { name: handed_over_to, in: query, schema: { type: string }, description: "Cận trên NỬA MỞ (<) — client gửi đầu ngày kế tiếp" }
        - { name: date_from, in: query, schema: { type: string } }
        - { name: date_to, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: page_size, in: query, schema: { type: integer } }
      responses: { '200': { description: OK } }
    post:
      tags: [Orders]
      summary: Tạo đơn trực tiếp (convenience/TODO — luồng chuẩn là import)
      responses: { '201': { description: Created } }
  /api/orders/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Orders], summary: Chi tiết đơn (items, batch, timeline), responses: { '200': { description: OK } } }
  /api/seller/orders/{id}/tracking/events:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Tracking]
      summary: Seller xem hành trình đơn CỦA MÌNH (kiểm tra quyền sở hữu ở service)
      responses:
        '200': { description: "{ events: [...], enabled: bool }" }
        '403': { description: Đơn không thuộc seller đang đăng nhập }
  /api/orders/{id}/tracking:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    patch:
      tags: [Tracking]
      summary: Cập nhật tracking thủ công (số vận đơn, đơn vị, trạng thái, URL)
      description: >
        Khi mã vận đơn thay đổi, hệ thống tự đăng ký mã đó lên 24hTrack kèm
        description "TAG:store_order_id" để lần sau tra ngược được.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tracking_number: { type: string }
                # Link nội bộ tới nhà cung cấp tracking. Không bao giờ có mặt
                # trong response của seller.
                tracking_url: { type: string }
                tracking_status:
                  type: string
                  enum: [NONE, PENDING, PRE_TRANSIT, IN_TRANSIT, OUT_FOR_DELIVERY, PICK_UP, DELIVERED, UNDELIVERED, EXCEPTION, EXPIRED, CANCELLED]
      responses: { '200': { description: OK } }
  /api/orders/tracking/import/template.xlsx:
    get:
      tags: [Tracking]
      summary: File mẫu gắn mã vận đơn hàng loạt (2 cột OrderID, Mã vận đơn)
      responses: { '200': { description: .xlsx attachment } }
  /api/orders/tracking/import:
    post:
      tags: [Tracking]
      summary: Preview gắn mã vận đơn từ file Excel/CSV (không ghi gì)
      description: >
        Đối chiếu từng dòng file với hệ thống. Cột OrderID nhận cả mã đơn shop
        lẫn mã nội bộ; dòng nào không chắc chắn (không tìm thấy, mã shop trùng
        nhiều đơn, hai mã vận đơn cho một đơn, một mã dán vào nhiều đơn, mã đã
        gắn cho đơn khác) trở thành issue thay vì đoán. Gửi kèm
        handed_over_from/to (khoảng ngày xuất xưởng đang lọc) để nhận thêm
        scope_total/scope_missing — số đơn trong khoảng đó file chưa phủ.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                handed_over_from: { type: string }
                handed_over_to: { type: string }
      responses:
        '200': { description: "{ summary, matches[], issues[], scope_missing[] } — scope_total/scope_missing = -1 khi không gửi khoảng ngày" }
  /api/orders/tracking/import/commit:
    post:
      tags: [Tracking]
      summary: Ghi các gán mã đã xác nhận từ preview (partial success)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [assignments]
              properties:
                assignments:
                  type: array
                  items:
                    type: object
                    required: [order_id, tracking_number]
                    properties:
                      order_id: { type: integer }
                      tracking_number: { type: string }
      responses:
        '200': { description: "{ updated, failed: [{order_id, reason}] } — mỗi đơn đi qua đúng luồng PATCH tracking (audit + đăng ký 24hTrack)" }
  /api/orders/{id}/tracking/events:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Tracking]
      summary: Hành trình đơn hàng (đọc từ DB, không gọi 24hTrack)
      responses:
        '200':
          description: "{ events: [...], enabled: bool } — enabled=false khi tích hợp 24hTrack đang tắt"
  /api/orders/{id}/tracking/sync:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Tracking]
      summary: Đồng bộ 1 đơn với 24hTrack
      description: >
        Đơn chưa có mã vận đơn thì tra 24hTrack theo store_order_id trước; nếu tìm
        thấy đúng 1 kiện thì gán mã rồi kéo trạng thái + hành trình về.
      responses:
        '200': { description: Order sau khi đồng bộ }
        '404': { description: 24hTrack chưa có dữ liệu cho đơn này }
        '422': { description: Tích hợp đang tắt hoặc gọi provider thất bại }
  /api/tracking/sync:
    post:
      tags: [Tracking]
      summary: Chạy 1 lượt đồng bộ (tra mã + cập nhật trạng thái) ngay, không đợi cron
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 40, maximum: 500 } }
      responses:
        '200': { description: "{ resolved, synced, changed, failed, skipped }" }
  /api/items:
    get:
      tags: [Items]
      summary: Item view (filter seller, store, sku, status, batch, date)
      parameters:
        - { name: sku, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, PRINTED, CUT, QC_PASSED] } }
        - { name: design_status, in: query, schema: { type: string } }
        - { name: batch_id, in: query, schema: { type: integer } }
        - name: seller_id
          in: query
          description: Chỉ lấy sản phẩm thuộc đơn của seller này.
          schema: { type: integer }
        - name: with_seller
          in: query
          description: >-
            Trả kèm seller của đơn (order.seller). Tắt mặc định vì đây là một
            round trip nữa tới DB; chỉ màn nào in tên seller mới bật.
          schema: { type: boolean }
      responses: { '200': { description: OK } }
  /api/items/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Items], summary: Chi tiết item, responses: { '200': { description: OK } } }
  /api/items/{id}/design:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    patch:
      tags: [Design]
      summary: Cập nhật print/cut/mockup file; set_ready=true để set design ready
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                print_file_url: { type: string }
                cut_file_url: { type: string }
                mockup_url: { type: string }
                design_url: { type: string }
                set_ready: { type: boolean }
      responses: { '200': { description: OK } }
  /api/design-queue:
    get: { tags: [Design], summary: Danh sách item cần design, responses: { '200': { description: OK } } }
  /api/design-queue/material-buckets:
    get: { tags: [Design], summary: Đếm item design-ready chưa batch theo material, responses: { '200': { description: OK } } }
  /api/design-queue/material/{materialId}/items:
    parameters: [{ name: materialId, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Design], summary: Item design-ready chưa batch của 1 material, responses: { '200': { description: OK } } }
  /api/batches:
    get:
      tags: [Batches]
      summary: Danh sách batch (filter material, status, priority, date)
      responses: { '200': { description: OK } }
    post:
      tags: [Batches]
      summary: Tạo batch cho 1 material từ các item (Designer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [material_id, order_item_ids]
              properties:
                material_id: { type: integer }
                order_item_ids: { type: array, items: { type: integer } }
                priority: { type: string, enum: [NORMAL, HIGH, URGENT] }
                due_date: { type: string }
                note: { type: string }
      responses: { '201': { description: Created } }
  /api/batches/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Batches], summary: Batch detail (item, SKU, mockup, file, status), responses: { '200': { description: OK } } }
    delete:
      tags: [Batches]
      summary: Xoá batch chưa sản xuất, trả sản phẩm về hàng chờ gom batch
      description: >-
        Chỉ xoá được batch còn PENDING toàn bộ (chưa in/cắt, chưa QC, chưa có
        hàng huỷ). Batch cha (chia theo định mức) xoá cả cụm con; batch con
        không xoá riêng lẻ. Batch đã vào sản xuất trả 422 — hàng lỗi/bỏ xử lý
        qua flow QC scrap. Sản phẩm được thả về màn gom batch để gom lại.
      responses:
        '200': { description: Đã xoá }
        '422': { description: Batch đã vào sản xuất / batch con / đã đóng }
  /api/batches/{id}/assets.zip:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Batches]
      summary: Download batch assets bundle as ZIP
      responses: { '200': { description: ZIP file } }
  /api/batches/{id}/scrap:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Batches]
      summary: Huỷ batch đã sản xuất (cả tấm hỏng) → đóng batch, trả sản phẩm về làm lại
      description: >-
        Ngược lại với DELETE. Xoá là undo của lệnh gom batch (chưa ai đụng vào,
        xoá sạch dấu vết); huỷ ghi nhận một tấm ĐÃ in/cắt hỏng thật: mọi phần
        còn sống được đánh dấu huỷ kèm lý do + người huỷ, batch đóng lại, sản
        phẩm quay về hàng chờ gom batch (route PRODUCTION) hoặc hàng chờ thiết
        kế (route DESIGN) và được gom vào một batch MỚI.
        Huỷ được từng batch con (mỗi con là một tấm vật lý); huỷ batch mẹ = huỷ
        mọi con còn mở, và mẹ tự đóng khi con cuối cùng đóng.
        Với hàng combo nhiều NVL, các phần NVL khác của cùng sản phẩm đang ở
        "đã QC" sẽ bị hạ về CUT — QC là cổng cấp sản phẩm, còn phần đang làm lại
        thì cả sản phẩm chưa QC xong.
        Từ chối (422) khi: batch chưa vào sản xuất và xoá được (dùng DELETE),
        batch đã đóng, hoặc ĐƠN của sản phẩm đã bắt đầu đóng gói.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 60, description: Lý do huỷ (bắt buộc) }
                route: { type: string, enum: [PRODUCTION, DESIGN], default: PRODUCTION }
      responses:
        '200': { description: Đã huỷ — trả về mã batch, số phần đã huỷ, sản phẩm bị ảnh hưởng, ghi chú đã mở }
        '422': { description: Batch chưa sản xuất (dùng DELETE) / đã đóng / đơn đã bắt đầu đóng gói }
  /api/batches/{id}/status:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    patch:
      tags: [Batches]
      summary: Cập nhật chặng sản xuất của batch (Pending/Đã in/Đã cắt)
      description: >-
        Bảng sản xuất chỉ đặt các chặng gia công (PENDING/PRINTED/CUT). QC_PASSED
        là cổng cấp sản phẩm, chỉ đặt 1 lần ở trạm QC (/api/qc/pass) khi mọi NVL
        đã sản xuất xong; batch tự lên QC_PASSED nhờ roll-up từ item đã QC.
        Sản xuất chỉ tiến, không lùi: không hạ batch về chặng trước đó (422).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [PENDING, PRINTED, CUT] }
                note: { type: string }
      responses: { '200': { description: OK } }
  /api/qc/scan:
    post:
      tags: [QC]
      summary: Scan tem item → trả info + mockup để đối chiếu
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { code: { type: string }, item_id: { type: integer } }
      responses: { '200': { description: OK } }
  /api/qc/pass:
    post:
      tags: [QC]
      summary: Xác nhận QC pass (sản phẩm khớp mockup) → Đã QC
      description: >-
        QC cấp sản phẩm, làm 1 lần: PASS đánh dấu Đã QC cho toàn bộ phần NVL của
        item cùng lúc. Chỉ hợp lệ khi mọi NVL của sản phẩm đã sản xuất xong.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                item_id: { type: integer }
                note: { type: string }
      responses: { '200': { description: OK } }
  /api/qc/fail:
    post:
      tags: [QC]
      summary: QC fail → huỷ phần hỏng, mở Required Attention / rework note
      description: >-
        Phần NVL bị lỗi được đánh dấu huỷ (ở nguyên batch đã làm ra nó) và sản
        phẩm quay về hàng chờ làm lại. Hàng combo: các phần NVL khác đang ở "đã
        QC" bị hạ về CUT, vì QC là cổng cấp sản phẩm. Từ chối (422) khi ĐƠN đã
        bắt đầu đóng gói.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                item_id: { type: integer }
                defect_code: { type: string }
                note: { type: string }
      responses: { '201': { description: Created note } }
  /api/qc/undo:
    post:
      tags: [QC]
      summary: Hạ QC đã bấm nhầm (OWNER/ADMIN) → mọi phần còn sống về "Đã cắt"
      description: >-
        Dành cho đúng một ca: BẤM NHẦM. Hàng vẫn nguyên vẹn, nên không tấm nào bị
        ghi bỏ, không tăng rework_count, không đụng link sản xuất và không đẩy
        sản phẩm về hàng chờ thiết kế — chỉ mở lại cổng QC. Ghi một bản ghi QC
        result=UNDO cho lịch sử.
        Hàng hỏng thật thì KHÔNG dùng lối này: dùng /api/qc/fail (một sản phẩm)
        hoặc /api/batches/{id}/scrap (cả tấm).
        Từ chối (422) khi sản phẩm chưa ở trạng thái đã QC, hoặc ĐƠN đã bắt đầu
        đóng gói.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                item_id: { type: integer }
                reason: { type: string, maxLength: 60 }
      responses:
        '200': { description: OK }
        '422': { description: Chưa QC pass / đơn đã bắt đầu đóng gói }
  /api/packing/scan:
    post:
      tags: [Packing]
      summary: Scan item đã QC vào package (block nếu chưa QC / over-scan)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id: { type: integer }
                code: { type: string }
                item_id: { type: integer }
      responses: { '200': { description: Expected vs scanned } }
  /api/packing/order/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Packing], summary: Trạng thái package của đơn, responses: { '200': { description: OK } } }
  /api/handoffs:
    get: { tags: [Handoffs], summary: Danh sách handoff THE, responses: { '200': { description: OK } } }
    post:
      tags: [Handoffs]
      summary: Tạo handoff THE (yêu cầu package đủ item)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id: { type: integer }
                package_id: { type: integer }
                box_type: { type: string }
                weight_grams: { type: integer }
                note: { type: string }
      responses: { '201': { description: Created } }
  /api/handoffs/{id}/ship:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Handoffs]
      summary: Đánh dấu handoff đã gửi (HANDED_OFF → SHIPPED)
      description: >
        Ghi nhận đơn vị vận chuyển + mã vận đơn cho một handoff đã bàn giao và
        chuyển đơn sang seller status SHIPPED. Chỉ áp dụng cho handoff đang ở
        trạng thái HANDED_OFF (409 nếu đã SHIPPED). Quyền: OWNER/ADMIN/OPS/PACKING/SHIPPING.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tracking_number]
              properties:
                tracking_number: { type: string, description: "Mã vận đơn (bắt buộc)" }
                label_url: { type: string, description: "Link nhãn/label (tuỳ chọn)" }
      responses:
        '200': { description: OK }
        '400': { description: Thiếu tracking_number }
        '404': { description: Không tìm thấy handoff }
        '409': { description: Handoff đã ở trạng thái đã gửi }
        '422': { description: Handoff chưa ở trạng thái HANDED_OFF }
  /api/notes:
    get:
      tags: [Notes]
      summary: Danh sách note / required attention
      description: >-
        Role CS chỉ thấy note có owner_role = CS (việc khách báo về đơn), không
        thấy note của khâu sản xuất — note hệ thống tự sinh đều mang role phải xử
        lý: thiếu file design → DESIGNER, lỗi QC → PRODUCTION, yêu cầu huỷ → OPS.
        Phạm vi lấy từ role đã xác thực, không nhận từ query.
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: severity, in: query, schema: { type: string } }
        - { name: required_attention, in: query, schema: { type: boolean } }
      responses: { '200': { description: OK } }
    post:
      tags: [Notes]
      summary: Tạo note
      description: CS tạo note mà không chọn phụ trách thì tự gán owner_role = CS.
      responses: { '201': { description: Created } }
  /api/notes/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Notes]
      summary: Chi tiết note
      responses:
        '200': { description: OK }
        '403': { description: CS mở note ngoài phạm vi CS }
    put:
      tags: [Notes]
      summary: Cập nhật note
      responses:
        '200': { description: OK }
        '403': { description: CS sửa note ngoài phạm vi CS }
    delete:
      tags: [Notes]
      summary: Xóa note
      responses:
        '200': { description: OK }
        '403': { description: CS xoá note ngoài phạm vi CS }
  /api/seller/orders:
    get:
      tags: [Seller View]
      summary: Seller xem đơn của mình (chỉ trạng thái tổng)
      responses: { '200': { description: OK } }
  /api/seller/orders/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Seller View], summary: Seller xem chi tiết đơn (sanitized), responses: { '200': { description: OK } } }
  /api/audit-logs:
    get: { tags: [Audit], summary: Audit log (ADMIN/OWNER), responses: { '200': { description: OK } } }
