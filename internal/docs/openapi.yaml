openapi: 3.0.3
info:
  title: THE Fulfillment Operations API
  version: 0.1.0-mvp
  description: >
    Backend MVP cho THE Fulfillment Operations Platform — quản lý đơn hàng và vận
    hành xưởng fulfillment: import đơn, design queue, batch theo nguyên vật liệu,
    production status (Pending/Đã in/Đã cắt/Đã QC), QC đối chiếu mockup, packing
    và handoff THE. Mọi response dùng envelope { success, data, meta?, error? }.
servers:
  - url: http://localhost:8080
    description: Local
tags:
  - name: Auth
  - name: Users
  - name: Sellers
  - name: Stores
  - name: Catalog
  - name: Import
  - name: Orders
  - name: Items
  - name: Design
  - name: Batches
  - name: QC
  - name: Packing
  - name: Handoffs
  - name: Notes
  - name: Seller View
  - name: Audit
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Envelope:
      type: object
      properties:
        success: { type: boolean }
        data: {}
        meta:
          type: object
          properties:
            page: { type: integer }
            page_size: { type: integer }
            total: { type: integer }
            total_pages: { type: integer }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, example: ops@the.local }
        password: { type: string, example: "Password123!" }
    ImportRow:
      type: object
      description: >
        Một dòng của file import (1 dòng = 1 sản phẩm; các dòng cùng ORDER ID gộp
        thành 1 đơn). Khoá là NHÃN CỘT trong file. Backend nhận cả nhãn template
        2026-08 (tiếng Việt) lẫn nhãn template cũ (StoreOrderID, ShippingName…).
        Các cột đã ngừng nhập — ShippingMethod, ProductName, VariantCode, IOSS,
        ShippingEmail — vẫn parse được nhưng bị bỏ qua và báo lại trong
        preview.headers.retired.
      properties:
        "Seller ID": { type: string, description: "Đối chiếu với seller đang import; khác seller → chặn dòng" }
        Account: { type: string }
        "Shop name": { type: string }
        DATE: { type: string, description: "Ngày đặt → order_date + STT trong ngày. 20/08/2026 hoặc 2026-08-20" }
        name: { type: string, description: "Tên người nhận" }
        "Địa chỉ nhận": { type: string }
        "Địa chỉ nhận (Phụ)": { type: string }
        "Thành phố": { type: string }
        "Mã vùng": { type: string, description: "Bang/tỉnh (KHÔNG phải mã vùng điện thoại)" }
        Zipcode: { type: string }
        "Quốc Gia": { type: string }
        "ORDER ID": { type: string }
        "MÃ SKU": { type: string }
        "Mã ảnh (nếu có)": { type: string }
        "SỐ LƯỢNG": { type: integer }
        "DESIGN ORDER": { type: string, description: "BẮT BUỘC — link (hoặc mã) design mặt trước; trống là lỗi DESIGN_MISSING" }
        designBack: { type: string, description: "Link design mặt sau (sản phẩm 2 mặt)" }
        Mockup: { type: string, description: "BẮT BUỘC — link http(s) ảnh mockup seller gửi, chuẩn QC; trống là lỗi MOCKUP_MISSING" }
        "EngraveText (if have)": { type: string }
        ShippingPhone: { type: string }
        Phone: { type: string, description: "Dự phòng: chỉ dùng khi ShippingPhone trống" }
        Note: { type: string }
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Auth]
      summary: Health check
      security: []
      responses: { '200': { description: OK } }
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập, trả JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Token + user }
        '401': { description: Sai thông tin đăng nhập }
  /api/me:
    get:
      tags: [Auth]
      summary: Thông tin user hiện tại
      responses: { '200': { description: User } }
  /api/users:
    get: { tags: [Users], summary: Danh sách user, responses: { '200': { description: OK } } }
    post:
      tags: [Users]
      summary: Tạo user (ADMIN/OWNER)
      description: >-
        Email trùng một tài khoản ĐÃ XOÁ bị từ chối 409 với code
        `USER_DELETED_EMAIL`, message nêu rõ tài khoản cũ là ai (họ tên + vai
        trò). Gửi lại kèm `restore_deleted: true` thì hệ thống KHÔI PHỤC chính
        tài khoản đó — giữ nguyên id, ghi đè họ tên/vai trò/mật khẩu mới — và
        ghi audit `USER_RESTORE` kèm thông tin cũ.
        Hai bước là cố ý: users.email là unique KHÔNG kèm điều kiện deleted_at
        nên không thể chèn hàng thứ hai, mà khôi phục thì trao lại toàn bộ lịch
        sử của người cũ (batch đã tạo, lượt QC, nhật ký) cho tài khoản đang tạo
        — nếu hộp thư đã chuyển cho người khác thì đó là gán nhầm việc.
        Email đang có người dùng thật vẫn bị từ chối 409 `CONFLICT` như cũ.
      responses:
        '201': { description: Created }
        '409': { description: 'Email đang dùng (CONFLICT), hoặc thuộc tài khoản đã xoá (USER_DELETED_EMAIL — gửi lại với restore_deleted=true để khôi phục)' }
  /api/users/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Users], summary: Chi tiết user, responses: { '200': { description: OK } } }
    put: { tags: [Users], summary: Cập nhật user, responses: { '200': { description: OK } } }
    delete:
      tags: [Users]
      summary: Xoá user (ADMIN/OWNER) — xoá mềm, giữ truy vết
      description: >-
        Xoá MỀM: tài khoản biến khỏi danh sách và không đăng nhập được nữa,
        nhưng hàng dữ liệu vẫn còn nên audit log, batch đã tạo và bản ghi QC của
        người đó không bị mồ côi. Tuyển lại đúng email này sau đó sẽ khôi phục
        chính tài khoản cũ (xem POST /api/users).
        Từ chối ba trường hợp: tự xoá tài khoản đang đăng nhập (422), xoá OWNER
        cuối cùng (422 — không còn ai quản trị hệ thống), và ADMIN xoá một OWNER
        (403 — chỉ OWNER mới xoá được OWNER).
        Muốn tạm dừng truy cập mà vẫn giữ tài khoản thì dùng PUT với
        `is_active=false` thay vì xoá.
      responses:
        '200': { description: Đã xoá }
        '403': { description: ADMIN không được xoá OWNER }
        '404': { description: Không tìm thấy user }
        '422': { description: Tự xoá chính mình / OWNER cuối cùng }
  /api/sellers:
    get: { tags: [Sellers], summary: Danh sách seller, responses: { '200': { description: OK } } }
    post: { tags: [Sellers], summary: Tạo seller, responses: { '201': { description: Created } } }
  /api/sellers/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Sellers], summary: Chi tiết seller, responses: { '200': { description: OK } } }
    put: { tags: [Sellers], summary: Cập nhật seller, responses: { '200': { description: OK } } }
    delete: { tags: [Sellers], summary: Xóa seller, responses: { '200': { description: OK } } }
  /api/sellers/{id}/api-keys:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Sellers]
      summary: Danh sách API key của seller
      description: >-
        Key để hệ thống của seller gọi Open API (`/api/open/v1`, tài liệu ở
        `/api/open/docs`). Trả cả key đã thu hồi. Không bao giờ trả key gốc hay
        hash — chỉ `prefix` (12 ký tự đầu) để phân biệt. Quyền: Master Data →
        Thao tác.
      responses: { '200': { description: OK } }
    post:
      tags: [Sellers]
      summary: Tạo API key cho seller
      description: >-
        Body `{ name }`. Response có `key` — key gốc, CHỈ hiện lần này (DB chỉ
        lưu SHA-256). Tối đa 5 key đang hoạt động mỗi seller. Chỉ ADMIN/OWNER
        (kèm Master Data → Thao tác): key quyết định ai được đẩy đơn dưới tên
        seller.
      responses: { '201': { description: Created } }
  /api/sellers/{id}/api-keys/{key_id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: key_id, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [Sellers]
      summary: Thu hồi API key
      description: >-
        Đóng dấu `revoked_at`; request kế tiếp dùng key này bị 401. Dòng key được
        giữ lại làm lịch sử. Thu hồi lần hai không đổi gì. Chỉ ADMIN/OWNER.
      responses: { '200': { description: OK } }
  /api/stores:
    get: { tags: [Stores], summary: Danh sách store, responses: { '200': { description: OK } } }
    post: { tags: [Stores], summary: Tạo store, responses: { '201': { description: Created } } }
  /api/stores/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Stores], summary: Chi tiết store, responses: { '200': { description: OK } } }
    put: { tags: [Stores], summary: Cập nhật store, responses: { '200': { description: OK } } }
    delete: { tags: [Stores], summary: Xóa store, responses: { '200': { description: OK } } }
  /api/materials:
    get: { tags: [Catalog], summary: Danh sách nguyên vật liệu, responses: { '200': { description: OK } } }
    post:
      tags: [Catalog]
      summary: Tạo material
      description: >-
        `length_mm` × `width_mm` là kích thước MỘT tấm NVL (mm) — cùng kích
        thước SKU tạo ra định mức sản xuất của từng SKU trên NVL này (xem POST
        /api/skus). Phải có cả hai hoặc bỏ trống cả hai — chỉ để ƯỚC TÍNH
        định mức cho cặp chưa khai. Định mức khai nằm ở từng cặp SKU – NVL
        (`materials[].products_per_unit` của SKU), không ở NVL.
      responses: { '201': { description: Created } }
  /api/materials/import/preview:
    post:
      tags: [Catalog]
      summary: Import kích thước NVL — xem trước
      description: >-
        File CSV/XLSX cột `Loại VL` + `Dài (mm)` + `Rộng (mm)` (hoặc một cột
        `D x R`) + `Mô tả` tuỳ chọn (multipart `file`), hoặc JSON `{ rows:
        [{ material, length_mm, width_mm, description }] }`. Một NVL = một tên;
        tên lặp trong file phải khớp nhau, hệ thống đang có nhiều NVL cùng tên
        thì báo lỗi chứ không tự chọn. Ô trống không ghi đè. Cột `Định mức` của
        mẫu cũ bị bỏ qua và nêu trong `notices`. Không ghi gì.
      responses: { '200': { description: OK } }
  /api/materials/import/commit:
    post:
      tags: [Catalog]
      summary: Import kích thước NVL — áp dụng
      description: Gửi lại `rows` đã xem trước; server phân tích lại trong transaction rồi tạo / cập nhật.
      responses: { '200': { description: OK } }
  /api/materials/import/template.xlsx:
    get: { tags: [Catalog], summary: File mẫu import kích thước NVL, responses: { '200': { description: OK } } }
  /api/materials/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Catalog], summary: Chi tiết material, responses: { '200': { description: OK } } }
    put: { tags: [Catalog], summary: Cập nhật material, responses: { '200': { description: OK } } }
    delete: { tags: [Catalog], summary: Xóa material, responses: { '200': { description: OK } } }
  /api/skus:
    get: { tags: [Catalog], summary: Danh sách SKU, responses: { '200': { description: OK } } }
    post:
      tags: [Catalog]
      summary: Tạo SKU (single hoặc combo nhiều material)
      description: >-
        Mỗi phần tử `materials[]` là một cặp (SKU, NVL): `quantity_per_unit` =
        một sản phẩm ăn bao nhiêu đơn vị NVL (định lượng vật tư);
        `products_per_unit` = ĐỊNH MỨC SẢN XUẤT KHAI của cặp — một tấm NVL ra
        được bao nhiêu sản phẩm của SKU này, theo file layout thật của xưởng
        (khách chốt 24/09/2026), null/≤0 = chưa khai. Định mức khai luôn thắng;
        cặp chưa khai thì hệ thống ƯỚC TÍNH bằng xếp lưới D x R lên tấm
        (⌊L/l⌋·⌊W/w⌋, lấy chiều tốt hơn — chia diện tích cho số cao hơn thực
        tế: mica 600×800 với 127×127 chia diện tích ra 29, xếp thật 24). Thiếu
        kích thước ở một trong hai bên và không khai = không có định mức (SKU
        đó không chẻ). GET /api/skus trả `quota` không có sẵn — client tính lại
        bằng cùng luật (utils/quota.ts).

        `length_mm` × `width_mm` là kích thước D x R của sản phẩm, đơn vị mm
        (làm tròn 0,01 mm), phải có cả hai hoặc bỏ trống cả hai.

        Cha → con: `parent_id` xếp SKU vào dưới một SKU cha (vd cha "Hộp nhựa",
        con "Hộp nhựa bé/lớn/vuông"). Đúng 2 tầng: SKU cha phải là SKU cấp trên
        cùng; SKU đang có con thì không nhận cha.
      responses: { '201': { description: Created } }
  /api/skus/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Catalog], summary: Chi tiết SKU, responses: { '200': { description: OK } } }
    put:
      tags: [Catalog]
      summary: Cập nhật SKU + material set
      description: >-
        Gửi `materials[]` là thay TOÀN BỘ material set.

        Đổi BỘ NVL (thêm/bỏ NVL) khi SKU còn sản phẩm trong xưởng đã vào batch,
        hoặc thêm hai NVL cùng loại khác độ dày (vd Basswood 3 ly + 5 ly), trả
        409 `SKU_MATERIAL_CHANGE_CONFIRM` với `error.details.skus[]` (số sản
        phẩm, NVL + mã batch, cặp cùng loại) — gửi lại kèm
        `confirm_material_change: true` để lưu. POST /api/skus và
        /api/master-data/import/commit cũng theo luật này.

        Mọi field đều là cập nhật từng phần: field không gửi = giữ nguyên (gửi
        chuỗi rỗng mới xoá `product_name`/`description`). `parent_id`: bỏ field
        = giữ, gửi 0 = tách khỏi SKU cha. `length_mm`/`width_mm`: bỏ = giữ, gửi
        0 cả hai = bỏ kích thước; gửi một bên 0 bên kia có số bị từ chối.
      responses: { '200': { description: OK } }
    delete:
      tags: [Catalog]
      summary: Xóa SKU
      description: >-
        SKU cha còn SKU con thì không xoá được — xoá (hoặc chuyển) các SKU con
        trước, hoặc xoá cả cha lẫn toàn bộ con trong cùng một lần bulk-delete.
      responses: { '200': { description: OK } }
  /api/master-data/parents/import/preview:
    post:
      tags: [Catalog]
      summary: "Import SKU cha (bước 1) — xem trước"
      description: >-
        File CSV/XLSX cột `SKU cha` + `Tên sản phẩm` + `Mô tả` (multipart
        `file`), hoặc JSON `{ rows: [{ sku, product_name, description }] }`.
        Trả từng SKU cha với action CREATE / UPDATE / NOCHANGE và số SKU con
        đang có. Không ghi gì. Mã đang là SKU con bị báo lỗi (chỉ 2 tầng).
      responses: { '200': { description: OK } }
  /api/master-data/parents/import/commit:
    post:
      tags: [Catalog]
      summary: "Import SKU cha (bước 1) — áp dụng"
      description: >-
        Gửi lại `rows` đã xem trước; server phân tích lại trong transaction rồi
        tạo SKU cha mới / cập nhật tên, mô tả. Ô trống không xoá giá trị cũ.
        Bước 2 là POST /api/master-data/import/preview với cột `SKU cha`,
        `D (mm)`, `R (mm)`: SKU cha phải có sẵn, không thì dòng đó báo lỗi.
      responses: { '200': { description: OK } }
  /api/master-data/parents/template.xlsx:
    get: { tags: [Catalog], summary: File mẫu import SKU cha, responses: { '200': { description: OK } } }
  /api/master-data/template.xlsx:
    get:
      tags: [Catalog]
      summary: File mẫu import SKU con (bước 2)
      description: >-
        Cột `SKU cha | SKU | Tên sản phẩm | Loại VL | D (mm) | R (mm) | Định mức
        | Mô tả`. `Định mức` = số sản phẩm một tấm Loại VL trên cùng dòng làm
        ra (định mức KHAI của cặp SKU – NVL); ô trống giữ số đã khai; số không
        nguyên dương → dòng lỗi QUOTA_INVALID; hai dòng cùng SKU khai hai số
        khác nhau cho cùng NVL → SKU lỗi QUOTA_CONFLICT. Preview trả
        `quota_by_material` + `quota_sources` (declared / estimated) cho từng SKU.
      responses: { '200': { description: OK } }
  /api/master-data/export.xlsx:
    get:
      tags: [Catalog]
      summary: Xuất toàn bộ SKU con / SKU lẻ hiện có theo khổ file import
      description: >-
        Mỗi dòng một cặp SKU × NVL, cột `Định mức` là số đã khai (trống = chưa
        khai), thêm cột `Ước tính theo kích thước (import bỏ qua)` để đối chiếu.
        Điền `Định mức` rồi nạp lại chính file này qua /api/master-data/import.
        SKU cha không có trong file (bước 1 quản).
      responses: { '200': { description: OK } }
  /api/orders/import:
    post:
      tags: [Import]
      summary: Import đơn (JSON rows hoặc multipart CSV). commit=false để preview.
      description: >-
        Gửi `seller_id` để import cả file cho một seller, hoặc
        `seller_mode=by_column` để mỗi dòng về đúng seller mà cột "Seller ID"
        ghi (khớp theo MÃ seller; "6" khớp "006"). Chế độ by_column chỉ preview:
        trả `sellers[]`, mỗi seller một `import_job_id`, commit từng job qua
        /api/orders/import/commit. Dòng không khớp seller nào nằm trong `errors`
        (SELLER_MISSING / SELLER_UNKNOWN / SELLER_AMBIGUOUS) và không thuộc job nào.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                seller_id: { type: integer }
                seller_mode: { type: string, enum: [by_column] }
                commit: { type: boolean }
                filename: { type: string }
                rows: { type: array, items: { $ref: '#/components/schemas/ImportRow' } }
          multipart/form-data:
            schema:
              type: object
              properties:
                seller_id: { type: integer }
                seller_mode: { type: string, enum: [by_column] }
                commit: { type: boolean }
                file: { type: string, format: binary }
      responses:
        '200': { description: Preview hoặc preview+commit result }
  /api/orders/import/commit:
    post:
      tags: [Import]
      summary: Commit một import job đã preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [import_job_id]
              properties: { import_job_id: { type: integer } }
      responses: { '200': { description: Committed import job } }
  /api/import-jobs:
    get: { tags: [Import], summary: Danh sách import job, responses: { '200': { description: OK } } }
  /api/import-jobs/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Import], summary: Chi tiết import job + lỗi theo dòng, responses: { '200': { description: OK } } }
  /api/orders:
    get:
      tags: [Orders]
      summary: Danh sách đơn (filter store, sku, status, date) + tra cứu CS
      description: >
        Mở cho cả role CS. `search` là ô tìm kiếm một dòng của màn CS: khớp
        store_order_id, internal_code, tracking_number, tên/điện thoại/email
        người nhận. Các tham số hẹp bên dưới dùng khi đã biết đang cầm mã gì.
      parameters:
        - { name: seller_id, in: query, schema: { type: integer } }
        - { name: store_id, in: query, schema: { type: integer } }
        - { name: sku, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [PRODUCTION, PACKED, HANDED_OFF, SHIPPED] } }
        - { name: store_order_id, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string }, description: Tra cứu CS một ô }
        - { name: internal_code, in: query, schema: { type: string } }
        - { name: tracking_number, in: query, schema: { type: string } }
        - { name: shipping_name, in: query, schema: { type: string }, description: Tên người nhận }
        - { name: shipping_phone, in: query, schema: { type: string } }
        - { name: tracking_status, in: query, schema: { type: string } }
        - { name: has_tracking, in: query, schema: { type: boolean }, description: "false = hàng đợi CS chưa có mã vận đơn" }
        - { name: handed_over, in: query, schema: { type: boolean }, description: "true = đơn đã gửi cho THE (màn Hành trình)" }
        - { name: handed_over_from, in: query, schema: { type: string }, description: "Lọc theo thời điểm xuất xưởng (RFC3339 hoặc YYYY-MM-DD), >=" }
        - { name: handed_over_to, in: query, schema: { type: string }, description: "Cận trên NỬA MỞ (<) — client gửi đầu ngày kế tiếp" }
        - { name: date_from, in: query, schema: { type: string }, description: "Ngày tạo đơn, >= (RFC3339; YYYY-MM-DD = 00:00 giờ VN)" }
        - { name: date_to, in: query, schema: { type: string }, description: "Cận trên NỬA MỞ (<) của ngày tạo — client gửi đầu phút / đầu ngày kế tiếp" }
        - { name: page, in: query, schema: { type: integer } }
        - { name: page_size, in: query, schema: { type: integer } }
      responses: { '200': { description: OK } }
    post:
      tags: [Orders]
      summary: Tạo đơn trực tiếp (convenience/TODO — luồng chuẩn là import). Mỗi item bắt buộc design_url + mockup_url như import
      responses: { '201': { description: Created } }
  /api/orders/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Orders], summary: Chi tiết đơn (items, batch, timeline), responses: { '200': { description: OK } } }
  /api/orders/{id}/timeline:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Orders]
      summary: Giờ hoàn thành từng khâu của đơn (import, duyệt, vào batch, in, cắt, QC, xuất kho) + người làm
      description: >-
        Quyền đọc đơn như chi tiết đơn. steps[] có key, at (null nếu chưa xong), by_id, by_name.
        Đã in / cắt / QC = lần ĐẦU mỗi item còn sống đạt trạng thái, lấy item cuối cùng.
      responses: { '200': { description: OK }, '404': { description: Không có đơn } }
  /api/seller/orders/{id}/tracking/events:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Tracking]
      summary: Seller xem hành trình đơn CỦA MÌNH (kiểm tra quyền sở hữu ở service)
      responses:
        '200': { description: "{ events: [...], enabled: bool }" }
        '403': { description: Đơn không thuộc seller đang đăng nhập }
  /api/orders/{id}/tracking:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    patch:
      tags: [Tracking]
      summary: Cập nhật tracking thủ công (số vận đơn, đơn vị, trạng thái, URL)
      description: >
        Khi mã vận đơn thay đổi, hệ thống tự đăng ký mã đó lên 24hTrack kèm
        description "TAG:store_order_id" để lần sau tra ngược được.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tracking_number: { type: string }
                # Link nội bộ tới nhà cung cấp tracking. Không bao giờ có mặt
                # trong response của seller.
                tracking_url: { type: string }
                tracking_status:
                  type: string
                  enum: [NONE, PENDING, PRE_TRANSIT, IN_TRANSIT, OUT_FOR_DELIVERY, PICK_UP, DELIVERED, UNDELIVERED, EXCEPTION, EXPIRED, CANCELLED]
      responses: { '200': { description: OK } }
  /api/orders/tracking/import/template.xlsx:
    get:
      tags: [Tracking]
      summary: File mẫu gắn mã vận đơn hàng loạt (2 cột OrderID, Mã vận đơn)
      responses: { '200': { description: .xlsx attachment } }
  /api/orders/tracking/import:
    post:
      tags: [Tracking]
      summary: Preview gắn mã vận đơn từ file Excel/CSV (không ghi gì)
      description: >
        Đối chiếu từng dòng file với hệ thống. Cột OrderID nhận cả mã đơn shop
        lẫn mã nội bộ; dòng nào không chắc chắn (không tìm thấy, mã shop trùng
        nhiều đơn, hai mã vận đơn cho một đơn, một mã dán vào nhiều đơn, mã đã
        gắn cho đơn khác) trở thành issue thay vì đoán. Gửi kèm
        handed_over_from/to (khoảng ngày xuất xưởng đang lọc) để nhận thêm
        scope_total/scope_missing — số đơn trong khoảng đó file chưa phủ.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                handed_over_from: { type: string }
                handed_over_to: { type: string }
      responses:
        '200': { description: "{ summary, matches[], issues[], scope_missing[] } — scope_total/scope_missing = -1 khi không gửi khoảng ngày; summary.skipped_blank = số dòng của file Xuất Excel để trống mã (bỏ qua, không phải lỗi)" }
  /api/orders/tracking/export.xlsx:
    get:
      tags: [Tracking]
      summary: Xuất Excel màn Hành trình đơn hàng (toàn bộ đơn khớp bộ lọc, nhập lại được)
      description: >
        Cùng tham số lọc với GET /api/orders (has_tracking, handed_over_from,
        handed_over_to, search…), không phân trang; luôn chỉ đơn đã bàn giao.
        Tối đa 5000 đơn mỗi lần (vượt thì 400 kèm số đơn khớp). Cột: Mã đơn
        shop, Mã nội bộ, Seller, Số sản phẩm, Tên người nhận, Thành phố,
        Tỉnh/Bang, Quốc gia, Xuất xưởng (giờ VN, ô ngày giờ Excel), Mã vận đơn
        (định dạng Text), Trạng thái, Trạng thái tracking, Chi tiết tracking,
        Vị trí tracking, Cập nhật tracking (giờ VN). Điền cột Mã vận đơn rồi
        tải chính file này lên POST /api/orders/tracking/import: khoá là Mã nội
        bộ, các cột khác được bỏ qua, dòng để trống mã được bỏ qua.
      parameters:
        - { name: has_tracking, in: query, schema: { type: boolean } }
        - { name: handed_over_from, in: query, schema: { type: string }, description: "RFC3339, cận dưới (gồm)" }
        - { name: handed_over_to, in: query, schema: { type: string }, description: "RFC3339, cận trên (không gồm, nửa mở)" }
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200': { description: .xlsx attachment }
        '400': { description: Bộ lọc khớp quá 5000 đơn, hoặc không có đơn nào }
  /api/orders/tracking/import/commit:
    post:
      tags: [Tracking]
      summary: Ghi các gán mã đã xác nhận từ preview (partial success)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [assignments]
              properties:
                assignments:
                  type: array
                  items:
                    type: object
                    required: [order_id, tracking_number]
                    properties:
                      order_id: { type: integer }
                      tracking_number: { type: string }
      responses:
        '200': { description: "{ updated, failed: [{order_id, reason}] } — mỗi đơn đi qua đúng luồng PATCH tracking (audit + đăng ký 24hTrack)" }
  /api/orders/{id}/tracking/events:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Tracking]
      summary: Hành trình đơn hàng (đọc từ DB, không gọi 24hTrack)
      responses:
        '200':
          description: "{ events: [...], enabled: bool } — enabled=false khi tích hợp 24hTrack đang tắt"
  /api/orders/{id}/tracking/sync:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Tracking]
      summary: Đồng bộ 1 đơn với 24hTrack
      description: >
        Đơn chưa có mã vận đơn thì tra 24hTrack theo store_order_id trước; nếu tìm
        thấy đúng 1 kiện thì gán mã rồi kéo trạng thái + hành trình về.
      responses:
        '200': { description: Order sau khi đồng bộ }
        '404': { description: 24hTrack chưa có dữ liệu cho đơn này }
        '422': { description: Tích hợp đang tắt hoặc gọi provider thất bại }
  /api/tracking/sync:
    post:
      tags: [Tracking]
      summary: Chạy 1 lượt đồng bộ (tra mã + cập nhật trạng thái) ngay, không đợi cron
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 40, maximum: 500 } }
      responses:
        '200': { description: "{ resolved, synced, changed, failed, skipped }" }
  /api/items:
    get:
      tags: [Items]
      summary: Item view (filter seller, store, sku, status, batch, date)
      parameters:
        - { name: sku, in: query, schema: { type: string }, description: "SKU có chứa chuỗi này, không phân biệt hoa thường (% và _ là chữ thường)" }
        - name: status
          in: query
          style: form
          explode: true
          description: >-
            Một hoặc nhiều giá trị, OR với nhau (?status=A,B hoặc ?status=A&status=B).
            Trạng thái nội bộ PENDING / PRINTED / CUT / QC_PASSED (QC_PASSED = "Đã QC":
            chỉ dòng của đơn còn trong xưởng, đã duyệt, chưa huỷ), hoặc nhóm suy ra:
            FILES_READY (= status=PENDING&files=ready), FILES_MISSING
            (= status=PENDING&files=missing), PACKED (= packed=true), HANDED_OVER
            (= handed_over=true). Một giá trị = y như trước. files / packed /
            handed_over là tham số kiểu cũ, AND với status.
          schema:
            type: array
            items: { type: string, enum: [PENDING, PRINTED, CUT, QC_PASSED, FILES_READY, FILES_MISSING, PACKED, HANDED_OVER] }
        - { name: design_status, in: query, schema: { type: string } }
        - name: batch
          in: query
          description: >-
            MÃ batch người dùng thấy (batches.code), có hoặc không dấu # ("102909" =
            "#102909"), không phân biệt hoa thường. Khớp ĐÚNG mã, không khớp chuỗi
            con: "1909" không ra #101909 (từ 23/11/2026).
          schema: { type: string }
        - { name: batch_id, in: query, description: "Id NỘI BỘ của batch (vd 1909 — mã #102909). Giữ cho tương thích.", schema: { type: integer } }
        - name: seller_id
          in: query
          style: form
          explode: true
          description: >-
            Chỉ lấy sản phẩm thuộc đơn của (các) seller này — một hoặc nhiều id, OR
            với nhau (?seller_id=3,7 hoặc ?seller_id=3&seller_id=7). Id không phải số bị bỏ qua.
          schema: { type: array, items: { type: integer } }
        - name: with_seller
          in: query
          description: >-
            Trả kèm seller của đơn (order.seller). Tắt mặc định vì đây là một
            round trip nữa tới DB; chỉ màn nào in tên seller mới bật.
          schema: { type: boolean }
        - name: files
          in: query
          description: >-
            Tách "Chờ xử lý" theo file sản xuất (tự kèm status=PENDING): ready =
            "Đã có file SX" — mọi phần sản xuất còn sống nằm trong batch đã có đủ
            link in + cắt và phủ đủ NVL của SKU; missing = các sản phẩm PENDING còn lại.
          schema: { type: string, enum: [ready, missing] }
        - name: with_files
          in: query
          description: >-
            Trả kèm cờ production_files_ready trên từng dòng (cùng điều kiện với
            files=ready). Tắt mặc định vì là một câu lệnh nữa tới DB.
          schema: { type: boolean }
      description: >-
        Mỗi dòng kèm `batch_items[]` (các phần sản xuất, gồm cả phần đã huỷ có
        `scrapped_at`); mỗi phần có `batch_id` (id nội bộ, để dựng link
        /batches/{id}), `batch_code` (mã người dùng thấy, vd "#102909" — từ
        23/11/2026) và `batch` (giữ cho client cũ). Hiển thị luôn dùng
        `batch_code`, không bao giờ "#" + batch_id. Chi tiết item và chi tiết đơn
        cũng có `batch_code`.
      responses: { '200': { description: OK } }
  /api/items/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Items], summary: Chi tiết item, responses: { '200': { description: OK } } }
  /api/items/{id}/design:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    patch:
      tags: [Design]
      summary: Cập nhật print/cut/mockup file; set_ready=true để set design ready
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                print_file_url: { type: string }
                cut_file_url: { type: string }
                mockup_url: { type: string }
                design_url: { type: string }
                set_ready: { type: boolean }
      responses: { '200': { description: OK } }
  /api/design-queue:
    get: { tags: [Design], summary: Danh sách item cần design, responses: { '200': { description: OK } } }
  /api/design-queue/material-buckets:
    get: { tags: [Design], summary: Đếm item design-ready chưa batch theo material, responses: { '200': { description: OK } } }
  /api/design-queue/material/{materialId}/items:
    parameters: [{ name: materialId, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Design]
      summary: Item design-ready chưa batch của 1 material
      description: >-
        Mỗi item kèm `batch_items[]` = các phần sống (chưa ghi bỏ) của nó, có
        `batch` (mã, trạng thái) và `material`. Item trong pool của NVL X chưa
        có phần trên X, nên phần nào ở đây cũng nằm ở NVL KHÁC: combo đang dở,
        hoặc SKU bị đổi NVL sau khi gom (màn Tạo batch gắn nhãn, không tự tick).
      responses: { '200': { description: OK } }
  /api/batches:
    get:
      tags: [Batches]
      summary: Danh sách batch (filter material, status, priority, date)
      parameters:
        - name: status
          in: query
          style: form
          explode: true
          description: >-
            Một hoặc nhiều giá trị, OR với nhau (?status=A,B hoặc ?status=A&status=B).
            Trạng thái thật PENDING / PRINTED / CUT / QC_PASSED (mọi batch ở trạng thái
            đó, như trước), hoặc nhãn suy ra: FILES_READY (= status=PENDING&files=ready,
            "Đã có file SX"), FILES_MISSING (= status=PENDING&files=missing, "Chờ xử
            lý"), HANDED_OVER (= status=QC_PASSED&handover=done, "Đã bàn giao"),
            HANDOVER_PENDING (= status=QC_PASSED&handover=pending, "Đã QC").
          schema:
            type: array
            items: { type: string, enum: [PENDING, PRINTED, CUT, QC_PASSED, FILES_READY, FILES_MISSING, HANDED_OVER, HANDOVER_PENDING] }
        - { name: files, in: query, description: "Kiểu cũ, AND với status: ready | missing (tự kèm PENDING)", schema: { type: string, enum: [ready, missing] } }
        - { name: handover, in: query, description: "Kiểu cũ, AND với status: done | pending (tự kèm QC_PASSED)", schema: { type: string, enum: [done, pending] } }
        - name: seller_id
          in: query
          style: form
          explode: true
          description: >-
            Batch có hàng của (các) seller này — một hoặc nhiều id, OR với nhau
            (?seller_id=3,7 hoặc lặp khoá). Batch có hàng của 2 seller chỉ ra một lần.
          schema: { type: array, items: { type: integer } }
        - { name: material_id, in: query, schema: { type: integer } }
        - { name: priority, in: query, schema: { type: string } }
        - { name: code, in: query, description: "Mã nội bộ đơn / mã tem item", schema: { type: string } }
        - { name: store_order, in: query, schema: { type: string } }
        - { name: sku, in: query, description: "Batch CHỨA dòng có mã SKU chứa chuỗi này (không phân biệt hoa thường; % và _ khớp đúng ký tự đó)", schema: { type: string } }
        - { name: open, in: query, description: "1/true: bỏ batch đã đóng (huỷ hết ở QC) — Bảng sản xuất dùng", schema: { type: string } }
        - name: stage
          in: query
          style: form
          explode: true
          description: >-
            Chặng suy ra của batch, LOẠI TRỪ NHAU (mỗi batch đúng một chặng), một hoặc
            nhiều giá trị OR với nhau, AND với mọi bộ lọc khác. CLOSED = đã đóng (huỷ
            batch / huỷ hết ở QC); NO_ITEMS = chưa đóng nhưng mọi dòng đơn đã huỷ;
            FILES_MISSING / FILES_READY = PENDING chưa / đã đủ link in + cắt; PRINTED;
            CUT; sau QC theo đơn chậm nhất còn sống: QC_PASSED (còn đơn chưa đóng
            gói), PACKED, HANDED_OFF, SHIPPED, DELIVERED. Giá trị lạ → 400. Mỗi dòng
            trả về có trường `stage`.
          schema:
            type: array
            items: { type: string, enum: [FILES_MISSING, FILES_READY, PRINTED, CUT, QC_PASSED, PACKED, HANDED_OFF, SHIPPED, DELIVERED, CLOSED, NO_ITEMS] }
        - { name: sort, in: query, description: "newest (mặc định, id giảm dần) | oldest (id tăng dần — cột còn việc của Bảng sản xuất)", schema: { type: string, enum: [newest, oldest] } }
        - { name: batch, in: query, description: "ĐÚNG mã batch, có/không dấu #, không phân biệt hoa thường (\"102909\" = \"#102909\"; từ 23/11/2026 không còn khớp chuỗi con — tìm một phần mã dùng q)", schema: { type: string } }
        - { name: date_from, in: query, schema: { type: string }, description: "Ngày tạo batch, >= (RFC3339; YYYY-MM-DD = 00:00 giờ VN)" }
        - { name: date_to, in: query, schema: { type: string }, description: "Cận trên NỬA MỞ (<) của ngày tạo — client gửi đầu phút / đầu ngày kế tiếp" }
        - { name: page, in: query, schema: { type: integer } }
        - { name: page_size, in: query, schema: { type: integer } }
      responses: { '200': { description: OK } }
    post:
      tags: [Batches]
      summary: Tạo batch cho 1 material từ các item (Designer)
      description: >-
        Chia các item theo nhóm SKU cha và định mức (xem /api/batches/auto) rồi
        tạo MỖI TẤM MỘT BATCH PHẲNG. Trả `batches[]` (mọi batch vừa tạo, theo
        thứ tự tấm), `batch` (= batches[0], giữ cho client cũ) và
        `skipped_item_ids`. Không còn batch mẹ/con từ 24/09/2026; các batch con
        cũ đã được tách thành batch thường khi API khởi động.

        Không bao giờ tạo batch rỗng: id lặp được gộp, không còn sản phẩm hợp
        lệ sau khi lọc thì trả 422 kèm lý do từng sản phẩm, không ghi gì.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [material_id, order_item_ids]
              properties:
                material_id: { type: integer }
                order_item_ids: { type: array, items: { type: integer } }
                priority: { type: string, enum: [NORMAL, HIGH, URGENT] }
                due_date: { type: string }
                note: { type: string }
      responses: { '201': { description: Created } }
  /api/batches/stage-counts:
    get:
      tags: [Batches]
      summary: Số batch mỗi chặng (Bảng sản xuất)
      description: >-
        Nhận đúng các tham số lọc của GET /api/batches nhưng BỎ QUA status / stage /
        files / handover / open / page / sort. Trả `stages` (mọi chặng đã biết, 0 nếu
        không có, cộng chặng lạ nếu DB có), `by_status` (trạng thái lưu → chặng →
        số), `rows` (bảng gốc) và `order` (thứ tự vòng đời). Một câu GROUP BY.
      responses: { '200': { description: OK } }
  /api/batches/filter-options:
    get:
      tags: [Batches]
      summary: Chất liệu / seller / ưu tiên đang có trong batch (kèm số batch)
      description: >-
        Lấy từ chính các batch chưa xoá, không từ danh mục: NVL / seller không có
        batch thì không có; đã xoá mềm mà còn batch thì có `deleted: true`. Seller
        đếm đúng cách ?seller_id= lọc.
      responses: { '200': { description: OK } }
  /api/batches/auto:
    post:
      tags: [Batches]
      summary: Tự tạo batch từ toàn bộ pool design-ready (OWNER/ADMIN/OPS/DESIGNER)
      description: >-
        Hệ thống tự phân loại theo NVL, trong mỗi NVL NHÓM THEO SKU CHA (SKU
        không có cha là nhóm của chính nó; khác nhóm không bao giờ chung batch),
        trong nhóm xếp SKU cùng mã trước rồi nhét SKU anh em vào chỗ trống theo
        MỨC CHIẾM DỤNG: mỗi sản phẩm chiếm 1/định mức tấm — định mức KHAI của
        cặp (SKU, NVL), chưa khai thì ước tính từ kích thước; SKU không có định
        mức thành một batch riêng không giới hạn (khách chốt 24/09/2026). Rồi tự
        sinh mã #101xxx và tạo batch; người vận hành không chọn từng sản phẩm,
        không đặt tên. Mỗi tấm là MỘT batch phẳng — không còn batch mẹ/con
        (khách chốt 24/09/2026: "bỏ lớp mẹ đi, để nó ra một batch mới cho dễ
        quản lý"). NVL nào không gom được
        (pool quá lớn, lỗi giữa chừng) được trả về trong `skipped` kèm lý do;
        material lỗi rollback riêng, không ảnh hưởng material khác.
      responses:
        '200': { description: 'created[] (mỗi NVL: batch_id/batch_code của batch đầu + batch_codes mọi batch đã tạo + số sản phẩm), skipped[], total_batches, total_items' }
  /api/batches/links/export.xlsx:
    get:
      tags: [Batches]
      summary: Xuất Excel bàn làm việc designer — mỗi dòng một batch chờ file sản xuất
      description: >-
        Gồm mọi batch PENDING chưa đóng.
        Cột: Phiên bản mẫu (batch-links-v1, trên từng dòng nên sort không phá),
        Batch ID (bất biến — căn cứ đối chiếu khi nhập lại), Mã batch, Chất
        liệu, Số item, Số sản phẩm, Link design (trang chi tiết batch — nơi tải
        ZIP design theo luồng sẵn có), Link in, Link cắt (giá trị hiện tại nếu
        đã có — upload lại không sửa gì thành no-op).
      responses:
        '200': { description: File .xlsx }
  /api/batches/links/import/preview:
    post:
      tags: [Batches]
      summary: Xem trước import link in/cắt từ Excel — KHÔNG ghi dữ liệu
      description: >-
        Đối chiếu từng dòng bằng Batch ID (kiểm tra thêm Mã batch khớp) — không
        bao giờ theo vị trí dòng hay đoán theo tên. Mỗi dòng trả về dữ liệu
        hiện tại, dữ liệu sẽ ghi, hành động (ASSIGN/REPLACE/UNCHANGED) và mức
        (OK/WARNING/ERROR kèm mã lỗi ổn định). Chỉ một dòng lỗi chặn là
        can_commit=false cho cả file — không âm thầm nhập một nửa.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: .xlsx/.xlsm/.csv theo mẫu batch-links-v1 }
      responses:
        '200': { description: 'summary{total_rows, ok, warnings, errors, assign, replace, unchanged}, rows[], can_commit' }
        '400': { description: File sai mẫu / thiếu cột bắt buộc / quá 1000 dòng }
  /api/batches/links/import/commit:
    post:
      tags: [Batches]
      summary: Xác nhận import link — MỘT transaction cho cả file, all-or-nothing
      description: >-
        Khoá mọi batch liên quan (theo thứ tự id), kiểm tra lại toàn bộ điều
        kiện của preview, so link hiện tại với link đã thấy lúc preview
        (expected_*) — lệch là huỷ TOÀN BỘ lần nhập và yêu cầu xem trước lại.
        Cặp link in+cắt ghi nguyên tử qua cùng một lõi với PUT /links; dòng
        REPLACE cần `reason`. Dòng trùng dữ liệu hiện tại là no-op, không tạo
        audit giả. Audit ghi người xác nhận, tên file, phiên bản mẫu và các
        batch đã đổi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                source_filename: { type: string }
                reason: { type: string, maxLength: 255, description: Bắt buộc khi có dòng REPLACE }
                rows:
                  type: array
                  items:
                    type: object
                    required: [batch_id, batch_code, print_url, cut_url]
                    properties:
                      batch_id: { type: integer }
                      batch_code: { type: string }
                      print_url: { type: string }
                      cut_url: { type: string }
                      expected_print_url: { type: string }
                      expected_cut_url: { type: string }
      responses:
        '200': { description: 'updated, unchanged, updated_batch_codes[]' }
        '422': { description: Batch đổi trạng thái/link sau preview, mã không khớp, thiếu lý do thay thế — cả lần nhập bị huỷ }
  /api/batches/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Batches], summary: Batch detail (item, SKU, mockup, file, status), responses: { '200': { description: OK } } }
  /api/batches/{id}/timeline:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Batches]
      summary: Tiến độ batch - tạo / đã in / đã cắt / QC xong lúc nào, ai bấm (lần đầu đạt mỗi trạng thái)
      responses: { '200': { description: OK }, '404': { description: Không có batch } }
    delete:
      tags: [Batches]
      summary: Xoá batch chưa sản xuất, trả sản phẩm về hàng chờ gom batch
      description: >-
        Chỉ xoá được batch có header PENDING, chưa đóng, và mọi phần hoặc chưa
        sản xuất (chưa in/cắt, chưa QC, chưa ghi bỏ) hoặc thuộc dòng đơn đã duyệt
        huỷ (cancellation_status APPROVED). Còn một phần đã sản xuất của dòng
        chưa huỷ thì trả 422 — hàng lỗi/bỏ xử lý qua flow QC scrap. Sản phẩm
        chưa huỷ được thả về màn gom batch để gom lại; sản phẩm đã duyệt huỷ giữ
        nguyên internal_status (bằng chứng đã sản xuất). Nhật ký BATCH_DELETE ghi
        từng phần bị xoá, trạng thái của nó và cờ only_cancelled_items.
      responses:
        '200': { description: Đã xoá }
        '422': { description: Batch đã vào sản xuất / đã đóng }
  /api/batches/{id}/links:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [Batches]
      summary: Nộp bộ file sản xuất — cặp link in + cắt nguyên tử (OWNER/ADMIN/OPS/DESIGNER)
      description: >-
        Lưu CẢ HAI link trong một transaction (khoá batch, upsert PRINT + CUT,
        fan-out xuống print_file_url/cut_file_url của mọi item còn hiệu lực) —
        lỗi bất kỳ rollback toàn bộ, không bao giờ có link in mới + link cắt cũ.
        Chỉ batch PENDING, chưa đóng. Thay link hiện có
        (REPLACE) bắt buộc `reason`. Cặp trùng hệt hiện tại là no-op (UNCHANGED),
        không audit. Audit BATCH_PRODUCTION_PACKAGE_SET giữ URL cũ + mới + lý do.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [print_url, cut_url]
              properties:
                print_url: { type: string }
                cut_url: { type: string }
                reason: { type: string, maxLength: 255 }
      responses:
        '200': { description: 'links[] (cả PRINT và CUT), action = ASSIGN|REPLACE|UNCHANGED' }
        '422': { description: Đã đóng / đã bắt đầu sản xuất (bộ file khoá) / hết item hợp lệ / thiếu lý do thay thế }
    patch:
      tags: [Batches]
      summary: Sửa MỘT link (PRINT hoặc CUT) — đường dự phòng, cùng luật khoá
      description: >-
        Giữ để tương thích; luật giống PUT: chỉ batch PENDING chưa đóng; thay
        bằng URL khác bắt buộc `reason`; audit giữ URL cũ,
        URL mới và lý do. UI chính dùng PUT (cặp nguyên tử).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, url]
              properties:
                kind: { type: string, enum: [PRINT, CUT] }
                url: { type: string }
                reason: { type: string, maxLength: 255 }
      responses:
        '200': { description: BatchLink }
        '422': { description: Batch khoá (mẹ/đóng/đã sản xuất) hoặc thiếu lý do thay thế }
  /api/batches/{id}/assets.zip:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Batches]
      summary: Download batch assets bundle as ZIP
      responses: { '200': { description: ZIP file } }
  /api/batches/{id}/scrap:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Batches]
      summary: Huỷ batch đã sản xuất (cả tấm hỏng) → đóng batch, trả sản phẩm về làm lại
      description: >-
        Ngược lại với DELETE. Xoá là undo của lệnh gom batch (chưa ai đụng vào,
        xoá sạch dấu vết); huỷ ghi nhận một tấm ĐÃ in/cắt hỏng thật: mọi phần
        còn sống được đánh dấu huỷ kèm lý do + người huỷ, batch đóng lại, sản
        phẩm quay về hàng chờ gom batch (route PRODUCTION) hoặc hàng chờ thiết
        kế (route DESIGN) và được gom vào một batch MỚI.
        Với hàng combo nhiều NVL, các phần NVL khác của cùng sản phẩm đang ở
        "đã QC" sẽ bị hạ về CUT — QC là cổng cấp sản phẩm, còn phần đang làm lại
        thì cả sản phẩm chưa QC xong.
        Từ chối (422) khi: batch chưa vào sản xuất và xoá được (dùng DELETE),
        batch đã đóng, hoặc ĐƠN của sản phẩm đã bắt đầu đóng gói.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 60, description: Lý do huỷ (bắt buộc) }
                route: { type: string, enum: [PRODUCTION, DESIGN], default: PRODUCTION }
      responses:
        '200': { description: Đã huỷ — trả về mã batch, số phần đã huỷ, sản phẩm bị ảnh hưởng, ghi chú đã mở }
        '422': { description: Batch chưa sản xuất (dùng DELETE) / đã đóng / đơn đã bắt đầu đóng gói }
  /api/batches/{id}/status:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    patch:
      tags: [Batches]
      summary: Cập nhật chặng sản xuất của batch (Pending/Đã in/Đã cắt)
      description: >-
        Bảng sản xuất chỉ đặt các chặng gia công (PENDING/PRINTED/CUT). QC_PASSED
        là cổng cấp sản phẩm, chỉ đặt 1 lần ở trạm QC (/api/qc/pass) khi mọi NVL
        đã sản xuất xong; batch tự lên QC_PASSED nhờ roll-up từ item đã QC.
        Sản xuất chỉ tiến, không lùi: không hạ batch về chặng trước đó (422).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [PENDING, PRINTED, CUT] }
                note: { type: string }
      responses: { '200': { description: OK } }
  /api/qc/scan:
    post:
      tags: [QC]
      summary: Scan tem item → trả info + mockup để đối chiếu
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { code: { type: string }, item_id: { type: integer } }
      responses: { '200': { description: OK } }
  /api/assets/thumb/{name}:
    get:
      tags: [QC]
      summary: Ảnh mockup đã thu nhỏ, phục vụ trạm QC
      description: >-
        Trả bản sao mockup đã thu nhỏ và lưu đệm trên đĩa của API, thay cho việc
        trình duyệt tải thẳng từ Google Drive (chậm hàng giây với file nặng).
        Route này KHÔNG dùng bearer token — thẻ <img> không gửi được header
        Authorization — nên chính URL là chứng thư: chữ ký HMAC gắn với đúng một
        item và có hạn dùng, do phản hồi /api/qc/scan cấp qua trường
        mockup_thumb_url. Sai chữ ký, hết hạn, hoặc không dựng được ảnh đều trả
        404 và màn QC tự lùi về link gốc.
      security: []
      parameters:
        - { name: name, in: path, required: true, schema: { type: string }, description: "<hash>.jpg" }
        - { name: i, in: query, required: true, schema: { type: integer }, description: item id }
        - { name: e, in: query, required: true, schema: { type: integer }, description: hạn dùng (unix) }
        - { name: s, in: query, required: true, schema: { type: string }, description: chữ ký HMAC }
      responses:
        '200':
          description: OK
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '404': { description: Không có ảnh để phục vụ (chữ ký sai/hết hạn, hoặc không dựng được) }
  /api/qc/pass:
    post:
      tags: [QC]
      summary: Xác nhận QC pass (sản phẩm khớp mockup) → Đã QC
      description: >-
        QC cấp sản phẩm, làm 1 lần: PASS đánh dấu Đã QC cho toàn bộ phần NVL của
        item cùng lúc. Chỉ hợp lệ khi mọi NVL của sản phẩm đã sản xuất xong.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                item_id: { type: integer }
                note: { type: string }
      responses: { '200': { description: OK } }
  /api/qc/fail:
    post:
      tags: [QC]
      summary: QC fail → huỷ phần hỏng, mở Required Attention / rework note
      description: >-
        Phần NVL bị lỗi được đánh dấu huỷ (ở nguyên batch đã làm ra nó) và sản
        phẩm quay về hàng chờ làm lại. Hàng combo: các phần NVL khác đang ở "đã
        QC" bị hạ về CUT, vì QC là cổng cấp sản phẩm. Từ chối (422) khi ĐƠN đã
        bắt đầu đóng gói.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                item_id: { type: integer }
                defect_code: { type: string }
                note: { type: string }
      responses: { '201': { description: Created note } }
  /api/qc/undo:
    post:
      tags: [QC]
      summary: Hạ QC đã bấm nhầm (OWNER/ADMIN) → mọi phần còn sống về "Đã cắt"
      description: >-
        Dành cho đúng một ca: BẤM NHẦM. Hàng vẫn nguyên vẹn, nên không tấm nào bị
        ghi bỏ, không tăng rework_count, không đụng link sản xuất và không đẩy
        sản phẩm về hàng chờ thiết kế — chỉ mở lại cổng QC. Ghi một bản ghi QC
        result=UNDO cho lịch sử.
        Hàng hỏng thật thì KHÔNG dùng lối này: dùng /api/qc/fail (một sản phẩm)
        hoặc /api/batches/{id}/scrap (cả tấm).
        Từ chối (422) khi sản phẩm chưa ở trạng thái đã QC, hoặc ĐƠN đã bắt đầu
        đóng gói.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                item_id: { type: integer }
                reason: { type: string, maxLength: 60 }
      responses:
        '200': { description: OK }
        '422': { description: Chưa QC pass / đơn đã bắt đầu đóng gói }
  /api/qc/rework-inplace:
    post:
      tags: [QC]
      summary: Làm lại tại chỗ (OWNER/ADMIN) — hàng QC fail đã in LẺ xong, không gom batch mới
      description: >-
        Đường thứ hai song song với gom batch mới. Với mỗi NVL của sản phẩm mà
        phần mới nhất đã huỷ và chưa có phần sống thay thế: tạo phần sản xuất lần
        kế tiếp (attempt+1) ở trạng thái "Đã cắt" NGAY TRONG batch của phần đã
        huỷ; batch đó nếu đã đóng thì mở lại (closed_at = NULL). Không tăng
        rework_count (QC fail đã đếm), không mở ghi chú mới, sản phẩm rời hàng chờ
        gom batch. Ghi nhật ký QC_REWORK_INPLACE kèm lý do huỷ cũ. Trả về đúng
        kết quả /api/qc/scan mới để trạm vẽ lại và PASS ngay.
        Từ chối: 403 sai vai trò / thiếu qc.manage; 422 không có phần đã huỷ, đã
        có phần sống thay thế, đơn chưa duyệt, đơn đã bắt đầu đóng gói; 409 sản
        phẩm hoặc đơn đã huỷ.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                item_id: { type: integer }
      responses:
        '200': { description: Kết quả quét mới (như /api/qc/scan) }
        '403': { description: Không phải OWNER/ADMIN/kỹ thuật viên hoặc thiếu qc.manage }
        '409': { description: Sản phẩm / đơn đã huỷ }
        '422': { description: Không có phần đã huỷ, đã có phần sống, đơn chưa duyệt, đơn đã đóng gói }
  /api/packing/scan:
    post:
      tags: [Packing]
      summary: Scan item đã QC vào package (block nếu chưa QC / over-scan)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id: { type: integer }
                code: { type: string }
                item_id: { type: integer }
      responses: { '200': { description: Expected vs scanned } }
  /api/packing/order/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Packing], summary: Trạng thái package của đơn, responses: { '200': { description: OK } } }
  /api/handoffs:
    get: { tags: [Handoffs], summary: Danh sách handoff THE, responses: { '200': { description: OK } } }
    post:
      tags: [Handoffs]
      summary: Tạo handoff THE (yêu cầu package đủ item)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id: { type: integer }
                package_id: { type: integer }
                box_type: { type: string }
                weight_grams: { type: integer }
                note: { type: string }
      responses: { '201': { description: Created } }
  /api/handoffs/{id}/ship:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    post:
      tags: [Handoffs]
      summary: Đánh dấu handoff đã gửi (HANDED_OFF → SHIPPED)
      description: >
        Ghi nhận đơn vị vận chuyển + mã vận đơn cho một handoff đã bàn giao và
        chuyển đơn sang seller status SHIPPED. Chỉ áp dụng cho handoff đang ở
        trạng thái HANDED_OFF (409 nếu đã SHIPPED). Quyền: OWNER/ADMIN/OPS/PACKING/SHIPPING.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tracking_number]
              properties:
                tracking_number: { type: string, description: "Mã vận đơn (bắt buộc)" }
                label_url: { type: string, description: "Link nhãn/label (tuỳ chọn)" }
      responses:
        '200': { description: OK }
        '400': { description: Thiếu tracking_number }
        '404': { description: Không tìm thấy handoff }
        '409': { description: Handoff đã ở trạng thái đã gửi }
        '422': { description: Handoff chưa ở trạng thái HANDED_OFF }
  /api/notes:
    get:
      tags: [Notes]
      summary: Danh sách note / required attention
      description: >-
        Role CS chỉ thấy note có owner_role = CS (việc khách báo về đơn), không
        thấy note của khâu sản xuất — note hệ thống tự sinh đều mang role phải xử
        lý: thiếu file design → DESIGNER, lỗi QC → PRODUCTION, yêu cầu huỷ → OPS.
        Phạm vi lấy từ role đã xác thực, không nhận từ query.
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: severity, in: query, schema: { type: string } }
        - { name: required_attention, in: query, schema: { type: boolean } }
      responses: { '200': { description: OK } }
    post:
      tags: [Notes]
      summary: Tạo note
      description: CS tạo note mà không chọn phụ trách thì tự gán owner_role = CS.
      responses: { '201': { description: Created } }
  /api/notes/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get:
      tags: [Notes]
      summary: Chi tiết note
      responses:
        '200': { description: OK }
        '403': { description: CS mở note ngoài phạm vi CS }
    put:
      tags: [Notes]
      summary: Cập nhật note
      responses:
        '200': { description: OK }
        '403': { description: CS sửa note ngoài phạm vi CS }
    delete:
      tags: [Notes]
      summary: Xóa note
      responses:
        '200': { description: OK }
        '403': { description: CS xoá note ngoài phạm vi CS }
  /api/seller/orders:
    get:
      tags: [Seller View]
      summary: Seller xem đơn của mình (chỉ trạng thái tổng)
      responses: { '200': { description: OK } }
  /api/seller/orders/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get: { tags: [Seller View], summary: Seller xem chi tiết đơn (sanitized), responses: { '200': { description: OK } } }
  /api/audit-logs:
    get:
      tags: [Audit]
      summary: Audit log (ADMIN/OWNER), tìm phía server
      parameters:
        - { name: order, in: query, description: "Mã đơn (internal code, store order id hoặc mã item): ra dòng của đơn, item và phần batch của đơn", schema: { type: string } }
        - { name: batch, in: query, description: "Mã batch, '#103000' hoặc '103000'", schema: { type: string } }
        - { name: actor, in: query, description: Một phần email hoặc tên người làm, schema: { type: string } }
        - { name: date_from, in: query, description: "Từ (gồm), YYYY-MM-DD giờ xưởng hoặc RFC3339", schema: { type: string } }
        - { name: date_to, in: query, description: "Đến (LOẠI TRỪ)", schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: page_size, in: query, schema: { type: integer } }
      responses: { '200': { description: OK } }
